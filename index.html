    <script>
      // Ensure fetch on window and Window.prototype has a setter to prevent
      // "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _fetchImpl = _origFetch;
          var desc = {
            get: function() {
              return _fetchImpl;
            },
            set: function(fn) {
              _fetchImpl = fn;
            },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (e1) {}
          }

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', desc);
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
